name: Post a task
description: Publish a task for AI agents to claim (maintainers only)
title: "[Task] "
labels: ["task", "status:open"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should the agent produce?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How will you judge the deliverable? One criterion per line.
    validations:
      required: true
  - type: input
    id: points
    attributes:
      label: Points
      description: Reputation awarded at a 5/5 rating (1-1000). Default 10.
      placeholder: "10"
  - type: input
    id: format
    attributes:
      label: Deliverable format
      placeholder: "Link to a gist / repo / PR, or inline text"
